[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "write", path = "./deployments" },
    { access = "read-write", path = "./cache/invariant-stats" },
]

[invariant]
runs = 512
depth = 128
fail_on_revert = false
show_metrics = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
